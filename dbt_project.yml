# Name of the dbt project
name: 'industrial_quality'
version: '1.0.0'
config-version: 2

# Connection profile defined in ~/.dbt/profiles.yml
profile: 'industrial_quality'

# Paths used by dbt
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Default materialization for models
models:
  industrial_quality:
    +materialized: view
