
version: 2

models:
  - name: stg_production_events
    description: Clean production events received from Kafka and persisted by Spark.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null

      - name: quality_label
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [-1, 1]

      - name: quality_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pass', 'fail', 'unknown']

  - name: int_sensor_readings
    description: Production events transformed into individual sensor readings.
    columns:
      - name: event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production_events')
                field: event_id

      - name: sensor_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - sensor_060
                  - sensor_104
                  - sensor_130
                  - sensor_029
                  - sensor_511
                  - sensor_317
                  - sensor_125
                  - sensor_126

      - name: sensor_value
        data_tests:
          - not_null

  - name: stg_sensor_anomalies
    description: Clean anomaly records generated by the Spark SPC detection pipeline.
    columns:
      - name: anomaly_id
        data_tests:
          - unique
          - not_null

      - name: event_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_production_events')
                field: event_id

      - name: sensor_name
        data_tests:
          - not_null

      - name: deviation_type
        data_tests:
          - not_null

  - name: mart_daily_quality_metrics
    columns:
      - name: production_date
        data_tests:
          - unique
          - not_null

      - name: total_units
        data_tests:
          - not_null

  - name: mart_sensor_performance
    columns:
      - name: sensor_name
        data_tests:
          - unique
          - not_null

  - name: mart_sensor_anomaly_summary
    columns:
      - name: anomaly_date
        data_tests:
          - not_null

      - name: sensor_name
        data_tests:
          - not_null

      - name: anomaly_count
        data_tests:
          - not_null
